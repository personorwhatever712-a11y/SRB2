name: Build SRB2 iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Base Tools
        run: brew install cmake sdl2 sdl2_mixer libpng curl
      
      - name: Configure and Build
        run: |
          mkdir build && cd build
          cmake .. \
            -DSRB2_CONFIG_SYSTEM_LIBRARIES=OFF \
            -DSRB2_CONFIG_USE_INTERNAL_LIBRARIES=ON \
            -DSRB2_CONFIG_USE_SDL2=ON \
            -DSRB2_CONFIG_MACOSX_BUNDLE=OFF \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_INSTALL_BINDIR=. \
            -DCMAKE_INSTALL_LIBDIR=. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -G "Unix Makefiles"
          make srb2
      
      - name: Package IPA
        run: |
          mkdir -p Payload/SRB2.app
          cp -r build/bin/srb2 Payload/SRB2.app/ || cp -r build/bin/SRB2SDL2 Payload/SRB2.app/
          zip -r srb2_ios.ipa Payload/
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: srb2-ipa
          path: srb2_ios.ipa
